spring:
  application:
    name: oism-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oism}
    username: ${DB_USER:oism}
    password: ${DB_PASSWORD:oism}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
oism:
  jwt:
    secret: ${JWT_SECRET}
  orders:
    reservation-minutes: ${ORDER_RESERVATION_MINUTES:15}
  jobs:
    expiry-delay-ms: ${ORDER_EXPIRY_DELAY_MS:60000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
