services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: oism
      POSTGRES_USER: oism
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oism}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oism -d oism"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: oism-backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/oism
      DB_USER: oism
      DB_PASSWORD: ${DB_PASSWORD:-oism}
      JWT_SECRET: ${JWT_SECRET:?Set a Base64 encoded secret of at least 32 bytes}
    ports:
      - "8080:8080"
volumes:
  pgdata:
